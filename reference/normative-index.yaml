    title: Межуровневая прослеживаемость подсистем (implements-edge)
    parent: null
    validates: [implements-edge-subsystem-to-system]
    gate: null

  - id: QG-0
    ref: standard/10-lifecycle-qg.md#10.3.1
    modality: MUST
